services:
  main_bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  support_bot:
    build:
      context: .
      dockerfile: support_bot/Dockerfile
    env_file:
      - ./support_bot/.env
    restart: unless-stopped

  payment_db:
    image: postgres:16
    environment:
      POSTGRES_DB: payment_bot
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
    ports:
      - "54329:5432"
    volumes:
      - payment_bot_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_bot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  payment_bot:
    build:
      context: .
      dockerfile: payment_bot/Dockerfile
    env_file:
      - ./payment_bot/.env
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      payment_db:
        condition: service_healthy

volumes:
  payment_bot_pg_data:
  

