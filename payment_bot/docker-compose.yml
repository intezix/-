services:
  payment_bot:
    build:
      context: ..
      dockerfile: payment_bot/Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      payment_db:
        condition: service_healthy

  payment_db:
    image: postgres:16
    environment:
      POSTGRES_DB: payment_bot
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
    ports:
      - "54329:5432"
    volumes:
      - payment_bot_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_bot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  payment_bot_pg_data:

